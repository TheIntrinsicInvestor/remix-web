name: lofi_sample_texture
target_stem: other
description: >
  Lo-fi telephone texture for keys/pads/Rhodes — aggressive bandpass for that
  telephone narrowness, slow chorus for tape wow/flutter, mild cassette saturation.
chain:
  - op: eq
    params:
      hpf: 300
      lpf: 4000
  - op: chorus
    params:
      rate_hz: 0.5
      depth: 0.5
      mix: 0.5
  - op: saturate
    params:
      drive_db: 6.0
