name: remix
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - ffmpeg        # conda-forge win-64 build
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cpu
    - torch==2.12.0
    - torchaudio==2.11.0
    - demucs==4.0.1
    - pedalboard
    - python-stretch==0.3.1
    - soundfile
    - librosa
    - pyyaml
    - sounddevice
